app = "top25"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DOCS_PUBLIC = "false"
  COOKIE_SECURE = "true"
  EMAIL_OUTBOX = "false"
  STORAGE_DIR = "/data/uploads"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "top25_uploads"
  destination = "/data/uploads"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  release_command = "alembic upgrade head"
