services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: top25
      POSTGRES_PASSWORD: top25
      POSTGRES_DB: top25
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U top25 -d top25"]
      interval: 2s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
